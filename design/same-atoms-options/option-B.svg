<title id="t">Same atoms, better configurations: one box of blocks</title><desc id="d">The same twelve blocks four times, rising up the page: a heap, a wall, a bridge, a home. Each build can do more than the one below. The same sun shines beside every stage. The rise is labelled growth.</desc>
