<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="t d">
<title id="t">Same atoms, better configurations: sand, glass, solar panel</title><desc id="d">Three stages rising up the page, with a close-up of the same nine silicon atoms in each. Sand: the atoms sit in separate loose grains. Glass: melted into one tangled net, which lets light through. Solar panel: one neat grid, which turns sunlight into power. The same sun shines beside every stage. The rise is labelled growth.</desc>
